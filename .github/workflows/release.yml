# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# Run it by hand (Actions > Release > Run workflow) to build the download
# without publishing anything.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the version is the same everywhere
        run: npm run check-version

      - name: Build the download
        run: npm run build

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "iNat Foray Printer $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --verify-tag

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist/
